[project]
name = "strata-hotpotqa-bench"
version = "0.1.0"
description = "Self-contained HotpotQA n=50 benchmark for strata_rag, comparable to KAG's promoted baseline"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[project.optional-dependencies]
# Only needed to (re)build data/n50.jsonl; the committed fixture makes it unnecessary for a run.
fetch = ["datasets>=3.0"]

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.22", "ruff>=0.8", "basedpyright>=1.22"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# Files copied from the kag evaluation harness keep KAG's text verbatim (see their headers).
extend-exclude = []

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # verbatim KAG prose uses unicode dashes / arrows

[tool.basedpyright]
include = ["."]
exclude = [".venv", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
